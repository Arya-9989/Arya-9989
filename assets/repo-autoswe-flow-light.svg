<svg xmlns="http://www.w3.org/2000/svg" width="420" height="364" aria-labelledby="rflow" role="img" viewBox="0 0 420 364"><title id="rflow">How AutoSWE works: plain-English spec in, deployable project out. Five agents hand the work along: analyst, architect, coder, DevOps and reviewer. Every generated file is parsed and policy-checked, with an automatic repair pass.</title><style>@keyframes e{0%{opacity:0;transform:translateY(12px)}}@keyframes ag{0%{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}.d{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;Segoe UI Variable Display&quot;,&quot;Segoe UI&quot;,Inter,Roboto,&quot;Helvetica Neue&quot;,Helvetica,Arial,Arimo,&quot;Liberation Sans&quot;,&quot;Nimbus Sans&quot;,sans-serif}.t{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;Segoe UI Variable Text&quot;,&quot;Segoe UI&quot;,Inter,Roboto,&quot;Helvetica Neue&quot;,Helvetica,Arial,Arimo,&quot;Liberation Sans&quot;,&quot;Nimbus Sans&quot;,sans-serif}.e{animation:e .6s cubic-bezier(.16,1,.3,1) .08s backwards}.n{display:none}@media (max-width:399px){.w{display:none}.n{display:inline}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="e"><rect width="408" height="358" x="6" fill="#f5f5f7" class="card" rx="24"/><g class="w"><text x="36" y="40.7" fill="#5e5ce6" class="t" font-size="15.12" font-weight="600">How AutoSWE works</text><text x="36" y="73.6" fill="#1d1d1f" class="d" font-size="25.92" font-weight="600" letter-spacing="-.156">Plain-English spec in.</text><text x="36" y="104.9" fill="#1d1d1f" class="d" font-size="25.92" font-weight="600" letter-spacing="-.156">Deployable project out.</text><text x="36" y="134.6" fill="#6e6e73" class="t" font-size="17.82" font-weight="400" letter-spacing="-.036">Five agents hand the work along.</text><text x="36" y="159.9" fill="#6e6e73" class="t" font-size="17.82" font-weight="400" letter-spacing="-.036">Every generated file is parsed and</text><text x="36" y="185.3" fill="#6e6e73" class="t" font-size="17.82" font-weight="400" letter-spacing="-.036">policy-checked, with an automatic</text><text x="36" y="210.7" fill="#6e6e73" class="t" font-size="17.82" font-weight="400" letter-spacing="-.036">repair pass.</text><path stroke="#d2d2d7" stroke-linecap="round" stroke-width="2" d="M63.07 243.977h287.438"/><circle cx="63.071" cy="243.977" r="7.56" fill="#5e5ce6"/><circle cx="134.93" cy="243.977" r="7.56" fill="#5e5ce6"/><circle cx="206.789" cy="243.977" r="7.56" fill="#5e5ce6"/><circle cx="278.649" cy="243.977" r="7.56" fill="#5e5ce6"/><circle cx="350.508" cy="243.977" r="7.56" fill="#5e5ce6"/><text x="63.071" y="269.9" fill="#6e6e73" class="t" font-size="14.58" font-weight="500" text-anchor="middle">Analyst</text><text x="134.93" y="269.9" fill="#6e6e73" class="t" font-size="14.58" font-weight="500" text-anchor="middle">Architect</text><text x="206.789" y="269.9" fill="#6e6e73" class="t" font-size="14.58" font-weight="500" text-anchor="middle">Coder</text><text x="278.649" y="269.9" fill="#6e6e73" class="t" font-size="14.58" font-weight="500" text-anchor="middle">DevOps</text><text x="350.508" y="269.9" fill="#6e6e73" class="t" font-size="14.58" font-weight="500" text-anchor="middle">Reviewer</text></g><g class="n"><text x="30" y="37.8" fill="#5e5ce6" class="t" font-size="19.41" font-weight="600" letter-spacing="-.039">How AutoSWE works</text><text x="30" y="71.3" fill="#1d1d1f" class="d" font-size="28" font-weight="600" letter-spacing="-.168">Plain-English spec in.</text><text x="30" y="104.3" fill="#1d1d1f" class="d" font-size="28" font-weight="600" letter-spacing="-.168">Deployable project out.</text><text x="30" y="134.8" fill="#6e6e73" class="t" font-size="19.41" font-weight="400" letter-spacing="-.039">Five agents hand the work along.</text><text x="30" y="160.4" fill="#6e6e73" class="t" font-size="19.41" font-weight="400" letter-spacing="-.039">Every generated file is parsed</text><text x=