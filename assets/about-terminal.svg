<svg xmlns="http://www.w3.org/2000/svg" width="860" height="390" viewBox="0 0 860 390" role="img" aria-label="Terminal: Arya Mahindrakar, DevOps Engineer, B.Tech Cloud Technology and Information Security, AWS Certified Cloud Practitioner, focus on DevOps, Cloud, Security and AI">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#0077b6"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="52" height="28" width="0"><animate attributeName="width" from="0" to="860" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="108" height="28" width="0"><animate attributeName="width" from="0" to="860" begin="1.5s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="164" height="28" width="0"><animate attributeName="width" from="0" to="860" begin="2.8s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="220" height="28" width="0"><animate attributeName="width" from="0" to="860" begin="4.1s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="276" height="28" width="0"><animate attributeName="width" from="0" to="860" begin="5.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; }
    .user { fill: #00ffff; font-weight: 700; }
    .path { fill: #7aa2f7; font-weight: 700; }
    .cmd  { fill: #e6edf3; }
    .out  { fill: #a9b1d6; }
    .hl   { fill: #00ffff; font-weight: 700; }
    .ok   { fill: #3fb950; font-weight: 700; }
    .dim  { fill: #6e7681; }
    .title { fill: #8b949e; font-size: 14px; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="858" height="388" rx="12" fill="#0d1117" stroke="url(#edge)" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h834 a12 12 0 0 1 12 12 v23 h-858 z" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="430" y="24" text-anchor="middle" class="title">arya@devops: ~</text>

  <!-- 1 -->
  <text x="24" y="72" clip-path="url(#c1)"><tspan class="user">arya@devops</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ whoami</tspan></text>
  <text x="24" y="98" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/><tspan class="hl">Arya Mahindrakar</tspan><tspan class="out"> · DevOps Engineer · Pune, India</tspan></text>

  <!-- 2 -->
  <text x="24" y="128" clip-path="url(#c2)"><tspan class="user">arya@devops</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ cat education.txt</tspan></text>
  <text x="24" y="154" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.3s" fill="freeze"/><tspan class="out">B.Tech, </tspan><tspan class="hl">Cloud Technology &amp; Information Security</tspan><tspan class="out"> (2022–2026)</tspan></text>

  <!-- 3 -->
  <text x="24" y="184" clip-path="url(#c3)"><tspan class="user">arya@devops</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ ls certifications/</tspan></text>
  <text x="24" y="210" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.3s" fill="freeze"/><tspan class="ok">✓ </tspan><tspan class="hl">AWS Certified Cloud Practitioner</tspan><tspan class="out">  (Apr 2026 – Apr 2029)</tspan></text>

  <!-- 4 -->
  <text x="24" y="240" clip-path="url(#c4)"><tspan class="user">arya@devops</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ ./deploy.sh --env production</tspan></text>
  <text x="24" y="266" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.3s" fill="freeze"/><tspan class="out">build </tspan><tspan class="ok">✓</tspan><tspan class="out">  test </tspan><tspan class="ok">✓</tspan><tspan class="out">  scan </tspan><tspan class="ok">✓</tspan><tspan class="out">  deploy </tspan><tspan class="ok">✓</tspan><tspan class="dim">   │  </tspan><tspan class="out">downtime: 20 min → </tspan><tspan class="hl">under 2 min</tspan></text>

  <!-- 5 -->
  <text x="24" y="296" clip-path="url(#c5)"><tspan class="user">arya@devops</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$ echo $FOCUS</tspan></text>
  <text x="24" y="322" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.3s" dur="0.3s" fill="freeze"/><tspan class="hl">DevOps</tspan><tspan class="dim"> · </tspan><tspan class="hl">Cloud</tspan><tspan class="dim"> · </tspan><tspan class="hl">Security</tspan><tspan class="dim"> · </tspan><tspan class="hl">AI Integrations</tspan></text>

  <!-- prompt + cursor -->
  <text x="24" y="358" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="6.8s" dur="0.1s" fill="freeze"/><tspan class="user">arya@devops</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="cmd">$</tspan></text>
  <rect x="168" y="343" width="10" height="20" fill="#00ffff" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="6.8s" repeatCount="indefinite"/>
  </rect>
</svg>
