<svg xmlns="http://www.w3.org/2000/svg" width="420" height="415" aria-labelledby="rflow" role="img" viewBox="0 0 420 415"><title id="rflow">How AutoSWE works: plain-English spec in, deployable project out. Five agents hand the work along: analyst, architect, coder, DevOps and reviewer. Every generated file is parsed and policy-checked, with an automatic repair pass.</title><style>@keyframes e{0%{opacity:0;transform:translateY(12px)}}@keyframes ag{0%{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(2.2)}}.d{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;Segoe UI Variable Display&quot;,&quot;Segoe UI&quot;,Inter,Roboto,&quot;Helvetica Neue&quot;,Helvetica,Arial,Arimo,&quot;Liberation Sans&quot;,&quot;Nimbus Sans&quot;,sans-serif}.t{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Text&quot;,&quot;Segoe UI Variable Text&quot;,&quot;Segoe UI&quot;,Inter,Roboto,&quot;Helvetica Neue&quot;,Helvetica,Arial,Arimo,&quot;Liberation Sans&quot;,&quot;Nimbus Sans&quot;,sans-serif}.e{animation:e .6s cubic-bezier(.16,1,.3,1) .08s backwards}.n{display:none}@media (max-width:399px){.w{display:none}.n{display:inline}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="e"><rect width="408" height="409" x="6" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".09" class="card" rx="24"/><g class="w"><text x="36" y="49.2" fill="#9a97ff" class="t" font-size="14.56" font-weight="600">How AutoSWE works</text><text x="36" y="89.7" fill="#f5f5f7" class="d" font-size="24.96" font-weight="600" letter-spacing="-.15">Plain-English spec in.</text><text x="36" y="119.9" fill="#f5f5f7" class="d" font-size="24.96" font-weight="600" letter-spacing="-.15">Deployable project out.</text><text x="36" y="148.5" fill="#a1a1a6" class="t" font-size="17.16" font-weight="400" letter-spacing="-.034">Five agents hand the work along.</text><text x="36" y="172.9" fill="#a1a1a6" class="t" font-size="17.16" font-weight="400" letter-spacing="-.034">Every generated file is parsed and</text><text x="36" y="197.3" fill="#a1a1a6" class="t" font-size="17.16" font-weight="400" letter-spacing="-.034">policy-checked, with an automatic</text><text x="36" y="221.8" fill="#a1a1a6" class="t" font-size="17.16" font-weight="400" letter-spacing="-.034">repair pass.</text><path stroke="#3a3a3c" stroke-linecap="round" stroke-width="2" d="M62.068 253.894h289.68"/><circle cx="62.068" cy="253.894" r="7.28" fill="#9a97ff"/><circle cx="134.488" cy="253.894" r="7.28" fill="#9a97ff"/><circle cx="206.908" cy="253.894" r="7.28" fill="#9a97ff"/><circle cx="279.328" cy="253.894" r="7.28" fill="#9a97ff"/><circle cx="351.748" cy="253.894" r="7.28" fill="#9a97ff"/><text x="62.068" y="279.1" fill="#a1a1a6" class="t" font-size="14.04" font-weight="500" text-anchor="middle">Analyst</text><text x="134.488" y="279.1" fill="#a1a1a6" class="t" font-size="14.04" font-weight="500" text-anchor="middle">Architect</text><text x="206.908" y="279.1" fill="#a1a1a6" class="t" font-size="14.04" font-weight="500" text-anchor="middle">Coder</text><text x="279.328" y="279.1" fill="#a1a1a6" class="t" font-size="14.04" font-weight="500" text-anchor="middle">DevOps</text><text x="351.748" y="279.1" fill="#a1a1a6" class="t" font-size="14.04" font-weight="500" text-anchor="middle">Reviewer</text></g><g class="n"><text x="30" y="44.9" fill="#9a97ff" class="t" font-size="19.41" font-weight="600" letter-spacing="-.039">How AutoSWE works</text><text x="30" y="85.9" fill="#f5f5f7" class="d" font-size="28" font-weight="600" letter-spacing="-.168">Plain-English spec in.</text><text x="30" y="118.9" fill="#f5f5f7" class="d" font-size="28" font-weight="600" letter-spacing="-.168">Deployable project out.</text><text x="30" y="149.4" fill="#a1a1a6" class="t" font-size="19.41" font-weight="400" letter-spacing="-.039">Five agents hand the work along.</text><text x="30" y="175" fill="#a1a1a6" class="t" font-size="19.41" font-weight="400" letter-spacing="-.039">Every generated file is parsed</text><text x="30" y="200.6" fill="#a1a1a6" class="t" font-size="19.41" font-weight="400" letter-spacing="-.039">and policy-checked, with an</text><text x="30" y="226.3" fill="#a1a1a6" class="t" font-size="19.41" font-weight="400" letter-spacing="-.039">automatic repair pass.</text><path stroke="#3a3a3c" stroke-linecap="round" stroke-width="2" d="M66.069 259.912h279.293"/><circle cx="66.069" cy="259.912" r="9" fill="#9a97ff"/><circle cx="135.892" cy="259.912" r="9" fill="#9a97ff"/><circle cx="205.716" cy="259.912" r="9" fill="#9a97ff"/><circle cx="275.539" cy="259.912" r="9" fill="#9a97ff"/><circle cx="345.362" cy="259.912" r="9" fill="#9a97ff"/><text x="66.069" y="290.8" fill="#a1a1a6" class="t" font-size="19.5" font-weight="500" letter-spacing="-.039" text-anchor="middle">Analyst</text><text x="205.716" y="290.8" fill="#a1a1a6" class="t" font-size="19.5" font-weight="500" letter-spacing="-.039" text-anchor="middle">Coder</text><text x="345.362" y="290.8" fill="#a1a1a6" class="t" font-size="19.5" font-weight="500" letter-spacing="-.039" text-anchor="middle">Reviewer</text><text x="135.892" y="316.1" fill="#a1a1a6" class="t" font-size="19.5" font-weight="500" letter-spacing="-.039" text-anchor="middle">Architect</text><text x="275.539" y="316.1" fill="#a1a1a6" class="t" font-size="19.5" font-weight="500" letter-spacing="-.039" text-anchor="middle">DevOps</text></g></g></svg>